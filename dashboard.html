<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Author Dashboard | RoboKriti</title><link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/page.css"><script src="../js/config.js"></script></head><body><div class="noise"></div><nav class="nav" style="top:0"><div class="container nav-inner"><a class="brand"><img src="../https://i.ibb.co/60g82LzR/Army-Welfare-Education-Society-logo-1.png"><span><strong>ROBOKRITI AUTHOR</strong><small>PRIVATE OPERATIONS</small></span></a><div class="links"><button id="logout" class="btn">LOG OUT</button></div></div></nav><main class="section" style="padding-top:140px"><div class="container"><div class="section-head"><div class="kicker">AUTHOR // COMMAND</div><div><h1 style="font:600 clamp(50px,7vw,90px)/.9 'Space Grotesk';letter-spacing:-.06em;margin:0">Operations <em>control.</em></h1><p style="color:var(--muted);line-height:1.8">Registrations and support requests are visible here. This dashboard is protected by server-side session authentication.</p></div></div><div class="split"><section class="form-card"><div class="mono">REGISTRATIONS</div><h2 style="font:500 32px 'Space Grotesk'">Latest submissions</h2><div id="regs">Loading…</div></section><section class="form-card"><div class="mono">HELP DESK</div><h2 style="font:500 32px 'Space Grotesk'">Latest tickets</h2><div id="tickets">Loading…</div></section></div></div></main><script src="../js/app.js"></script><script>async function load(){try{const d=await roboApi('/api/author/overview');const render=x=>x.length?x.map(v=>`<div style="padding:14px 0;border-bottom:1px solid var(--line)"><b>${v.id}</b><br><span style="color:var(--muted);font-size:12px">${v.name||v.email||''} · ${v.status||'NEW'}</span></div>`).join(''):'<p class="mono">No records yet.</p>';document.querySelector('#regs').innerHTML=render(d.registrations);document.querySelector('#tickets').innerHTML=render(d.tickets)}catch(e){location.href='login.html'}}load();document.querySelector('#logout').onclick=async()=>{await roboApi('/api/auth/logout',{method:'POST'});location.href='login.html'}</script></body></html>

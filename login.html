<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Author Access | RoboKriti</title><link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/page.css"><script src="../js/config.js"></script></head><body><div class="noise"></div><main class="section" style="min-height:100vh;display:grid;place-items:center"><div class="container" style="max-width:520px"><div class="form-card"><div class="mono">RESTRICTED // AUTHOR PORTAL</div><h1 style="font:600 50px 'Space Grotesk';letter-spacing:-.05em">Private <em>access.</em></h1><p style="color:var(--muted);line-height:1.7">This portal is not part of the public website. Only authorised RoboKriti personnel with an active account can enter.</p><form id="loginForm" class="form"><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Password</label><input name="password" type="password" required></div><button class="btn primary" type="submit">AUTHENTICATE →</button><p id="loginStatus" class="mono"></p></form><a class="mono" href="../index.html">← RETURN TO PUBLIC SITE</a></div></div></main><script src="../js/app.js"></script><script>document.querySelector('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const f=e.currentTarget;try{await roboApi('/api/auth/login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(f).entries()))});location.href='dashboard.html'}catch(err){document.querySelector('#loginStatus').textContent=err.message}})</script></body></html>
